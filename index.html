<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriAgent - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; }
        
        .header { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; }
        .header input { padding: 10px 16px; border-radius: 8px; border: none; width: 300px; font-size: 14px; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; border: 2px solid #ddd; background: #fff; transition: all 0.2s; }
        .tab:hover { border-color: #16a34a; }
        .tab.active { background: #16a34a; color: #fff; border-color: #16a34a; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .stat-card .number { font-size: 32px; font-weight: 800; color: #16a34a; }
        .stat-card .label { font-size: 13px; color: #666; margin-top: 4px; }
        
        .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h3 { margin-bottom: 16px; color: #16a34a; font-size: 18px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #f8fafc; font-weight: 700; color: #555; }
        tr:hover { background: #f8fafc; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-danger { background: #fee2e2; color: #dc2626; }
        .badge-info { background: #dbeafe; color: #2563eb; }
        .badge-purple { background: #f3e8ff; color: #7c3aed; }
        
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .btn-green { background: #16a34a; color: #fff; }
        .btn-green:hover { background: #15803d; }
        .btn-red { background: #dc2626; color: #fff; }
        .btn-blue { background: #2563eb; color: #fff; }
        .btn-purple { background: #7c3aed; color: #fff; }
        
        .loading { text-align: center; padding: 40px; color: #666; }
        .empty { text-align: center; padding: 40px; color: #999; }
        
        .api-url { background: #1e293b; color: #e2e8f0; padding: 12px 16px; border-radius: 8px; font-family: monospace; font-size: 13px; margin-bottom: 16px; word-break: break-all; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border-radius: 16px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content pre { background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 12px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌾 AgriAgent Admin</h1>
        <div>
            <input type="text" id="apiUrl" placeholder="API Base URL" value="https://payable-rozamond-school1660440-91bb5cb8.koyeb.app">
            <button class="btn btn-green" onclick="fetchAll()" style="margin-left: 8px;">🔄 Refresh</button>
        </div>
    </div>

    <div class="container">
        <!-- Stats -->
        <div class="stats" id="stats"></div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('users')">👤 Users</div>
            <div class="tab" onclick="switchTab('labourers')">👷 Labourers</div>
            <div class="tab" onclick="switchTab('contractors')">🏗️ Contractors</div>
            <div class="tab" onclick="switchTab('equipment')">🚜 Equipment</div>
            <div class="tab" onclick="switchTab('ads')">📢 Ads</div>
            <div class="tab" onclick="switchTab('payments')">💳 Payments</div>
            <div class="tab" onclick="switchTab('problems')">🌿 Problems</div>
            <div class="tab" onclick="switchTab('shops')">🏪 Shops</div>
        </div>

        <!-- Content -->
        <div id="content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        const API = document.getElementById('apiUrl').value;
        let currentTab = 'users';

        async function fetchAPI(endpoint) {
            try {
                const res = await fetch(`${API}${endpoint}`);
                return await res.json();
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        async function fetchAll() {
            document.getElementById('stats').innerHTML = '<div class="loading">Loading stats...</div>';
            
            const [users, labourers, contractors, equipment, ads, payments, problems, shops] = await Promise.all([
                fetchAPI('/api/auth/me').catch(() => ({})),
                fetchAPI('/api/debug/labourers'),
                fetchAPI('/api/debug/contractors'),
                fetchAPI('/api/equipment'),
                fetchAPI('/api/ads/active?limit=50'),
                fetchAPI('/api/debug/payments'),
                fetchAPI('/api/problems'),
                fetchAPI('/api/fertilizer-shops'),
            ]);

            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="number">${labourers?.totalLabourers || 0}</div><div class="label">Labourers</div></div>
                <div class="stat-card"><div class="number">${contractors?.totalContractors || 0}</div><div class="label">Contractors</div></div>
                <div class="stat-card"><div class="number">${equipment?.equipment?.length || 0}</div><div class="label">Equipment</div></div>
                <div class="stat-card"><div class="number">${ads?.ads?.length || 0}</div><div class="label">Active Ads</div></div>
                <div class="stat-card"><div class="number">${payments?.payments?.length || 0}</div><div class="label">Payments</div></div>
                <div class="stat-card"><div class="number">${problems?.problems?.length || 0}</div><div class="label">Problems</div></div>
            `;

            // Store data
            window.cache = { labourers, contractors, equipment, ads, payments, problems, shops };
            switchTab(currentTab);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const cache = window.cache || {};
            const content = document.getElementById('content');

            switch(tab) {
                case 'users':
                    content.innerHTML = '<div class="card"><h3>User Management</h3><p>Users are managed through the app. Labourers and contractors are listed in their respective tabs.</p></div>';
                    break;
                case 'labourers':
                    renderLabourers(cache.labourers);
                    break;
                case 'contractors':
                    renderContractors(cache.contractors);
                    break;
                case 'equipment':
                    renderEquipment(cache.equipment);
                    break;
                case 'ads':
                    renderAds(cache.ads);
                    break;
                case 'payments':
                    renderPayments(cache.payments);
                    break;
                case 'problems':
                    renderProblems(cache.problems);
                    break;
                case 'shops':
                    renderShops(cache.shops);
                    break;
            }
        }

        function renderLabourers(data) {
            if (!data?.labourers?.length) {
                document.getElementById('content').innerHTML = '<div class="card"><h3>👷 Labourers</h3><div class="empty">No labourers found</div></div>';
                return;
            }
            let html = `<div class="card"><h3>👷 Labourers (${data.totalLabourers})</h3><table><tr><th>Name</th><th>Phone</th><th>Skills</th><th>Experience</th><th>Available</th><th>Location</th></tr>`;
            data.labourers.forEach(l => {
                html += `<tr>
                    <td><strong>${l.name || 'N/A'}</strong></td>
                    <td>${l.phone || 'N/A'}</td>
                    <td>${(l.skills || []).map(s => `<span class="badge badge-success">${s}</span>`).join(' ')}</td>
                    <td>${l.experience || 0} yrs</td>
                    <td>${l.isAvailable ? '<span class="badge badge-success">Available</span>' : '<span class="badge badge-danger">Unavailable</span>'}</td>
                    <td>${l.hasLocation ? '📍 Set' : '❌ Not set'}</td>
                </tr>`;
            });
            html += '</table></div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderContractors(data) {
            if (!data?.contractors?.length) {
                document.getElementById('content').innerHTML = '<div class="card"><h3>🏗️ Contractors</h3><div class="empty">No contractors found</div></div>';
                return;
            }
            let html = `<div class="card"><h3>🏗️ Contractors (${data.totalContractors})</h3><table><tr><th>Company</th><th>Contact</th><th>Phone</th><th>Team</th><th>Crops</th><th>Location</th></tr>`;
            data.contractors.forEach(c => {
                html += `<tr>
                    <td><strong>${c.companyName || c.name || 'N/A'}</strong></td>
                    <td>${c.name || 'N/A'}</td>
                    <td>${c.phone || 'N/A'}</td>
                    <td>${c.teamSize || 'N/A'}</td>
                    <td>${(c.crops || []).map(cr => `<span class="badge badge-purple">${cr}</span>`).join(' ')}</td>
                    <td>${c.hasLocation ? '📍 Set' : '❌ Not set'}</td>
                </tr>`;
            });
            html += '</table></div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderEquipment(data) {
            if (!data?.equipment?.length) {
                document.getElementById('content').innerHTML = '<div class="card"><h3>🚜 Equipment</h3><div class="empty">No equipment listed</div></div>';
                return;
            }
            let html = `<div class="card"><h3>🚜 Equipment (${data.equipment.length})</h3><table><tr><th>Name</th><th>Category</th><th>Price/Day</th><th>Deposit</th><th>Available</th></tr>`;
            data.equipment.forEach(e => {
                html += `<tr>
                    <td><strong>${e.name || 'N/A'}</strong></td>
                    <td>${e.category || 'N/A'}</td>
                    <td>₹${e.pricing?.perDay || 0}</td>
                    <td>₹${e.pricing?.deposit || 0}</td>
                    <td>${e.availability?.isAvailable ? '<span class="badge badge-success">Yes</span>' : '<span class="badge badge-danger">No</span>'}</td>
                </tr>`;
            });
            html += '</table></div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderAds(data) {
            if (!data?.ads?.length) {
                document.getElementById('content').innerHTML = '<div class="card"><h3>📢 Ads</h3><div class="empty">No active ads</div></div>';
                return;
            }
            let html = `<div class="card"><h3>📢 Active Ads (${data.ads.length})</h3><table><tr><th>Title</th><th>Placement</th><th>Budget</th><th>Clicks</th><th>Status</th><th>Action</th></tr>`;
            data.ads.forEach(a => {
                const statusColor = a.status === 'active' ? 'badge-success' : a.status === 'pending' ? 'badge-warning' : 'badge-danger';
                html += `<tr>
                    <td><strong>${a.title || 'N/A'}</strong></td>
                    <td><span class="badge badge-info">${a.placement || 'home'}</span></td>
                    <td>₹${a.budget || 0}</td>
                    <td>${a.clicks || 0}</td>
                    <td><span class="badge ${statusColor}">${a.status}</span></td>
                    <td><button class="btn btn-blue" onclick="showDetail('ad', '${a._id}')">View</button></td>
                </tr>`;
            });
            html += '</table></div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderPayments(data) {
            if (!data?.payments?.length) {
                document.getElementById('content').innerHTML = '<div class="card"><h3>💳 Payments</h3><div class="empty">No payments found</div></div>';
                return;
            }
            let html = `<div class="card"><h3>💳 Recent Payments (${data.payments.length})</h3><table><tr><th>Amount</th><th>UTR</th><th>Status</th><th>Confirmed</th><th>Date</th><th>Action</th></tr>`;
            data.payments.forEach(p => {
                const statusColor = p.status === 'completed' ? 'badge-success' : p.status === 'pending_verification' ? 'badge-warning' : 'badge-info';
                html += `<tr>
                    <td><strong>₹${p.amount || 0}</strong></td>
                    <td>${p.utrNumber || 'N/A'}</td>
                    <td><span class="badge ${statusColor}">${p.status}</span></td>
                    <td>${p.userConfirmed ? '✅' : '❌'}</td>
                    <td>${new Date(p.createdAt).toLocaleDateString()}</td>
                    <td>
                        ${p.status === 'pending_verification' ? `<button class="btn btn-green" onclick="verifyPayment('${p.id}')">Verify</button>` : ''}
                    </td>
                </tr>`;
            });
            html += '</table></div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderProblems(data) {
            if (!data?.problems?.length) {
                document.getElementById('content').innerHTML = '<div class="card"><h3>🌿 Problems</h3><div class="empty">No problems posted</div></div>';
                return;
            }
            let html = `<div class="card"><h3>🌿 Problems (${data.problems.length})</h3><table><tr><th>Title</th><th>Crop</th><th>Upvotes</th><th>Solutions</th><th>Date</th></tr>`;
            data.problems.forEach(p => {
                html += `<tr>
                    <td><strong>${p.title || 'N/A'}</strong></td>
                    <td><span class="badge badge-success">${p.cropType || 'N/A'}</span></td>
                    <td>👍 ${p.upvotes || 0}</td>
                    <td>💬 ${p.solutionCount || 0}</td>
                    <td>${new Date(p.createdAt).toLocaleDateString()}</td>
                </tr>`;
            });
            html += '</table></div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderShops(data) {
            if (!data?.shops?.length) {
                document.getElementById('content').innerHTML = '<div class="card"><h3>🏪 Fertilizer Shops</h3><div class="empty">No shops listed</div></div>';
                return;
            }
            let html = `<div class="card"><h3>🏪 Fertilizer Shops (${data.shops.length})</h3><table><tr><th>Name</th><th>Owner</th><th>Phone</th><th>Village</th><th>Rating</th></tr>`;
            data.shops.forEach(s => {
                html += `<tr>
                    <td><strong>${s.name || 'N/A'}</strong></td>
                    <td>${s.ownerName || 'N/A'}</td>
                    <td>${s.phone || 'N/A'}</td>
                    <td>${s.location?.village || 'N/A'}</td>
                    <td>⭐ ${s.rating || 0} (${s.totalRatings || 0})</td>
                </tr>`;
            });
            html += '</table></div>';
            document.getElementById('content').innerHTML = html;
        }

        function showDetail(type, id) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            content.innerHTML = `<h3>Details</h3><p>ID: ${id}</p><p>Type: ${type}</p>`;
            modal.classList.add('active');
        }

        async function verifyPayment(id) {
            if (!confirm('Verify this payment? This will activate the ad.')) return;
            try {
                const res = await fetch(`${API}/api/payments/${id}/verify`, { method: 'PUT' });
                const data = await res.json();
                if (data.success) { alert('Payment verified!'); fetchAll(); }
                else { alert('Error: ' + (data.error || 'Unknown')); }
            } catch (e) { alert('Failed to verify payment'); }
        }

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        // Initial load
        fetchAll();
    </script>
</body>
</html>
