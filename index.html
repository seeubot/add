<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>AgriAgent · Admin Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0f2b1e 0%, #1a3b2b 100%);
      color: #e2e8f0;
      padding: 1.5rem 1rem;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    }

    .sidebar-header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      padding-left: 0.5rem;
      color: #f0f9e8;
    }
    .sidebar-header span { color: #86c553; }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
    }

    .nav-item {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-size: 0.9rem;
    }

    .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    
    .nav-item.active {
      background: #2c5e3b;
      color: white;
      font-weight: 600;
    }

    .logout-btn {
      margin-top: auto;
      background: rgba(255,255,255,0.1);
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.75rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .logout-btn:hover { background: rgba(220,38,38,0.3); }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      flex: 1;
      padding: 2rem;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-title { font-size: 1.8rem; font-weight: 700; color: #0f2b1e; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    .stat-value { font-size: 2rem; font-weight: 700; color: #0f2b1e; }
    .stat-label { color: #64748b; font-size: 0.9rem; margin-top: 4px; }

    .section-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
      border: 1px solid #e2e8f0;
    }

    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    select, input {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      outline: none;
    }
    select:focus, input:focus { border-color: #2c5e3b; }

    button {
      background: #1e4a2c;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }
    button:hover { background: #2c5e3b; }
    
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; }
    .btn-outline { background: white; border: 1px solid #1e4a2c; color: #1e4a2c; }
    .btn-outline:hover { background: #f0fdf4; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      padding: 0.8rem 0.5rem;
      color: #475569;
      font-weight: 600;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }
    td {
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .status-badge {
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-active { background: #d1fae5; color: #065f46; }
    .status-completed { background: #dbeafe; color: #1e40af; }
    .status-failed { background: #fee2e2; color: #991b1b; }

    .login-container {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      color: white;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast-success { background: #16a34a; }
    .toast-error { background: #dc2626; }
    .toast-info { background: #2563eb; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">🌾 Agri<span>Agent</span></div>
    <nav class="nav-menu">
      <button class="nav-item active" data-page="dashboard">📊 Dashboard</button>
      <button class="nav-item" data-page="users">👥 Users</button>
      <button class="nav-item" data-page="ads">📢 Ads</button>
      <button class="nav-item" data-page="payments">💳 Payments</button>
      <button class="nav-item" data-page="reports">⚠️ Reports</button>
      <button class="nav-item" data-page="equipment">🚜 Equipment</button>
      <button class="nav-item" data-page="shops">🏪 Shops</button>
    </nav>
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Login Screen -->
    <div id="loginScreen">
      <div class="login-container">
        <h2 style="margin-bottom:1.5rem; color:#0f2b1e;">Admin Login</h2>
        <input type="text" id="loginUsername" placeholder="Username" style="width:100%; margin-bottom:1rem; padding:0.75rem;"><br>
        <input type="password" id="loginPassword" placeholder="Password" style="width:100%; margin-bottom:1.5rem; padding:0.75rem;"><br>
        <button onclick="login()" style="width:100%; padding:0.75rem;">Sign In</button>
        <p id="loginError" style="color:#dc2626; margin-top:0.5rem; font-size:0.9rem;"></p>
      </div>
    </div>

    <!-- App Content -->
    <div id="appContent" class="hidden"></div>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <script>
    const API_BASE = 'https://payable-rozamond-school1660440-91bb5cb8.koyeb.app';
    let authToken = localStorage.getItem('adminToken') || '';

    // Toast notification
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // API helper
    async function api(url, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      
      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);
      
      const response = await fetch(`${API_BASE}${url}`, options);
      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      
      return data;
    }

    // Check authentication
    async function checkAuth() {
      if (!authToken) {
        showLogin();
        return false;
      }
      
      try {
        await api('/api/admin/session');
        showApp();
        return true;
      } catch (e) {
        authToken = '';
        localStorage.removeItem('adminToken');
        showLogin();
        return false;
      }
    }

    function showLogin() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('appContent').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appContent').classList.remove('hidden');
    }

    // Login
    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';
      
      if (!username || !password) {
        errorEl.textContent = 'Please enter credentials';
        return;
      }
      
      try {
        const data = await api('/api/admin/login', 'POST', { username, password });
        if (data.success) {
          authToken = data.token;
          localStorage.setItem('adminToken', authToken);
          showToast('Login successful!', 'success');
          showApp();
          loadPage('dashboard');
        }
      } catch (e) {
        errorEl.textContent = e.message;
        showToast('Login failed: ' + e.message, 'error');
      }
    }

    function logout() {
      authToken = '';
      localStorage.removeItem('adminToken');
      showLogin();
      showToast('Logged out', 'info');
    }

    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelector('.nav-item.active')?.classList.remove('active');
        this.classList.add('active');
        loadPage(this.dataset.page);
      });
    });

    // Load pages
    async function loadPage(page) {
      const content = document.getElementById('appContent');
      content.innerHTML = '<div style="text-align:center; padding:3rem;">Loading...</div>';
      
      try {
        switch(page) {
          case 'dashboard': await renderDashboard(content); break;
          case 'users': await renderUsers(content); break;
          case 'ads': await renderAds(content); break;
          case 'payments': await renderPayments(content); break;
          case 'reports': await renderReports(content); break;
          case 'equipment': await renderEquipment(content); break;
          case 'shops': await renderShops(content); break;
        }
      } catch (e) {
        content.innerHTML = `<div style="color:#dc2626; padding:2rem;">Error: ${e.message}</div>`;
        if (e.message.includes('Authentication') || e.message.includes('token')) {
          logout();
        }
      }
    }

    // Dashboard
    async function renderDashboard(container) {
      const data = await api('/api/admin/stats');
      const s = data.stats;
      
      container.innerHTML = `
        <div class="top-bar">
          <h1 class="page-title">Dashboard</h1>
          <span class="status-badge status-active">Super Admin</span>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value">${s.totalUsers}</div><div class="stat-label">Total Users</div></div>
          <div class="stat-card"><div class="stat-value">${s.activeLabourers}</div><div class="stat-label">Active Labourers</div></div>
          <div class="stat-card"><div class="stat-value">${s.totalEquipment}</div><div class="stat-label">Equipment</div></div>
          <div class="stat-card"><div class="stat-value">${s.totalProduce}</div><div class="stat-label">Produce</div></div>
          <div class="stat-card"><div class="stat-value">${s.pendingPayments}</div><div class="stat-label">Pending Payments</div></div>
          <div class="stat-card"><div class="stat-value">${s.activeAds}</div><div class="stat-label">Active Ads</div></div>
          <div class="stat-card"><div class="stat-value">${s.totalBookings}</div><div class="stat-label">Bookings</div></div>
          <div class="stat-card"><div class="stat-value">${s.pendingReports}</div><div class="stat-label">Pending Reports</div></div>
        </div>
      `;
    }

    // Users
    async function renderUsers(container) {
      const data = await api('/api/admin/users?limit=50');
      const users = data.users || [];
      
      container.innerHTML = `
        <div class="top-bar">
          <h1 class="page-title">Users</h1>
          <span class="status-badge status-active">${users.length} users</span>
        </div>
        <div class="section-card">
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Verified</th><th>Active</th><th>Actions</th></tr></thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td>${u.profile?.name || 'N/A'}</td>
                    <td>${u.email || 'N/A'}</td>
                    <td>${u.profile?.phone || '-'}</td>
                    <td>${u.role || 'farmer'}</td>
                    <td>${u.verification?.isVerified ? '✅' : '❌'}</td>
                    <td>${u.isActive ? '✅' : '❌'}</td>
                    <td>
                      <button class="btn-sm" onclick="toggleUser('${u._id}', ${u.isActive})">${u.isActive ? 'Deactivate' : 'Activate'}</button>
                      ${!u.verification?.isVerified ? `<button class="btn-sm" onclick="verifyUser('${u._id}')" style="margin-left:4px;">Verify</button>` : ''}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      
      window.toggleUser = async (id, isActive) => {
        try {
          await api(`/api/admin/users/${id}/toggle`, 'PUT');
          showToast(`User ${isActive ? 'deactivated' : 'activated'}`, 'success');
          loadPage('users');
        } catch (e) { showToast(e.message, 'error'); }
      };
      
      window.verifyUser = async (id) => {
        try {
          await api(`/api/admin/users/${id}/verify`, 'PUT');
          showToast('User verified', 'success');
          loadPage('users');
        } catch (e) { showToast(e.message, 'error'); }
      };
    }

    // Ads
    async function renderAds(container) {
      const data = await api('/api/admin/ads?limit=50');
      const ads = data.ads || [];
      
      container.innerHTML = `
        <div class="top-bar">
          <h1 class="page-title">Advertisements</h1>
          <span class="status-badge status-active">${ads.length} ads</span>
        </div>
        <div class="section-card">
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>Title</th><th>Advertiser</th><th>Type</th><th>Budget</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead>
              <tbody>
                ${ads.map(ad => `
                  <tr>
                    <td>${ad.title || 'Untitled'}</td>
                    <td>${ad.advertiserId?.profile?.name || 'N/A'}</td>
                    <td>${ad.type}</td>
                    <td>₹${ad.budget || 0}</td>
                    <td><span class="status-badge status-${ad.status}">${ad.status}</span></td>
                    <td><span class="status-badge status-${ad.paymentStatus || 'pending'}">${ad.paymentStatus || 'pending'}</span></td>
                    <td>
                      <select onchange="updateAdStatus('${ad._id}', this.value)" style="padding:0.3rem;">
                        <option value="">Change</option>
                        <option value="active">Active</option>
                        <option value="paused">Paused</option>
                        <option value="completed">Complete</option>
                        <option value="rejected">Reject</option>
                      </select>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      
      window.updateAdStatus = async (id, status) => {
        if (!status) return;
        try {
          await api(`/api/admin/ads/${id}/status`, 'PUT', { status });
          showToast(`Ad status updated to ${status}`, 'success');
          loadPage('ads');
        } catch (e) { showToast(e.message, 'error'); }
      };
    }

    // Payments
    async function renderPayments(container) {
      const data = await api('/api/admin/payments?limit=50');
      const payments = data.payments || [];
      
      container.innerHTML = `
        <div class="top-bar">
          <h1 class="page-title">Payments</h1>
          <span class="status-badge status-active">${payments.length} payments</span>
        </div>
        <div class="section-card">
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>User</th><th>Amount</th><th>UTR</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${payments.map(p => `
                  <tr>
                    <td>${p.userId?.profile?.name || 'N/A'}</td>
                    <td>₹${p.amount || 0}</td>
                    <td>${p.utrNumber || '-'}</td>
                    <td><span class="status-badge status-${p.status}">${p.status}</span></td>
                    <td>
                      ${p.status === 'pending_verification' ? `
                        <button class="btn-sm" onclick="verifyPayment('${p._id}')">✅ Approve</button>
                        <button class="btn-sm btn-danger" onclick="rejectPayment('${p._id}')" style="margin-left:4px;">❌ Reject</button>
                      ` : '-'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      
      window.verifyPayment = async (id) => {
        if (!confirm('Approve this payment?')) return;
        try {
          await api(`/api/admin/payments/${id}/verify`, 'PUT');
          showToast('Payment approved', 'success');
          loadPage('payments');
        } catch (e) { showToast(e.message, 'error'); }
      };
      
      window.rejectPayment = async (id) => {
        if (!confirm('Reject this payment?')) return;
        try {
          await api(`/api/admin/payments/${id}/reject`, 'PUT');
          showToast('Payment rejected', 'info');
          loadPage('payments');
        } catch (e) { showToast(e.message, 'error'); }
      };
    }

    // Reports
    async function renderReports(container) {
      const data = await api('/api/admin/reports?limit=50');
      const reports = data.reports || [];
      
      container.innerHTML = `
        <div class="top-bar">
          <h1 class="page-title">Reports</h1>
          <span class="status-badge status-active">${reports.length} reports</span>
        </div>
        <div class="section-card">
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>Reporter</th><th>Type</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${reports.map(r => `
                  <tr>
                    <td>${r.reporterId?.profile?.name || 'N/A'}</td>
                    <td>${r.type}</td>
                    <td>${r.reason}</td>
                    <td><span class="status-badge status-${r.status}">${r.status}</span></td>
                    <td>
                      <select onchange="updateReport('${r._id}', this.value)" style="padding:0.3rem;">
                        <option value="">Update</option>
                        <option value="reviewed">Reviewed</option>
                        <option value="resolved">Resolved</option>
                      </select>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      
      window.updateReport = async (id, status) => {
        if (!status) return;
        try {
          await api(`/api/admin/reports/${id}`, 'PUT', { status });
          showToast(`Report ${status}`, 'success');
          loadPage('reports');
        } catch (e) { showToast(e.message, 'error'); }
      };
    }

    // Equipment
    async function renderEquipment(container) {
      const data = await api('/api/admin/equipment?limit=50');
      const equipment = data.equipment || [];
      
      container.innerHTML = `
        <div class="top-bar">
          <h1 class="page-title">Equipment</h1>
          <span class="status-badge status-active">${equipment.length} items</span>
        </div>
        <div class="section-card">
          <table>
            <thead><tr><th>Name</th><th>Category</th><th>Owner</th><th>Price/Day</th><th>Verified</th><th>Actions</th></tr></thead>
            <tbody>
              ${equipment.map(e => `
                <tr>
                  <td>${e.name}</td><td>${e.category}</td>
                  <td>${e.ownerId?.profile?.name || 'N/A'}</td>
                  <td>₹${e.pricing?.perDay || 0}</td>
                  <td>${e.isVerified ? '✅' : '❌'}</td>
                  <td>${!e.isVerified ? `<button class="btn-sm" onclick="verifyEquip('${e._id}')">Verify</button>` : '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      
      window.verifyEquip = async (id) => {
        try {
          await api(`/api/admin/equipment/${id}/verify`, 'PUT');
          showToast('Equipment verified', 'success');
          loadPage('equipment');
        } catch (e) { showToast(e.message, 'error'); }
      };
    }

    // Shops
    async function renderShops(container) {
      const data = await api('/api/admin/shops?limit=50');
      const shops = data.shops || [];
      
      container.innerHTML = `
        <div class="top-bar">
          <h1 class="page-title">Fertilizer Shops</h1>
          <span class="status-badge status-active">${shops.length} shops</span>
        </div>
        <div class="section-card">
          <table>
            <thead><tr><th>Shop Name</th><th>Owner</th><th>Village</th><th>Rating</th><th>Verified</th><th>Actions</th></tr></thead>
            <tbody>
              ${shops.map(s => `
                <tr>
                  <td>${s.name}</td><td>${s.ownerName || 'N/A'}</td>
                  <td>${s.location?.village || 'N/A'}</td>
                  <td>⭐ ${s.rating || 0}</td>
                  <td>${s.isVerified ? '✅' : '❌'}</td>
                  <td>${!s.isVerified ? `<button class="btn-sm" onclick="verifyShop('${s._id}')">Verify</button>` : '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      
      window.verifyShop = async (id) => {
        try {
          await api(`/api/admin/shops/${id}/verify`, 'PUT');
          showToast('Shop verified', 'success');
          loadPage('shops');
        } catch (e) { showToast(e.message, 'error'); }
      };
    }

    // Initialize
    checkAuth().then(isAuth => {
      if (isAuth) loadPage('dashboard');
    });

    // Allow Enter key for login
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !document.getElementById('appContent').classList.contains('hidden') === false) {
        const loginScreen = document.getElementById('loginScreen');
        if (!loginScreen.classList.contains('hidden')) {
          login();
        }
      }
    });
  </script>
</body>
</html>
